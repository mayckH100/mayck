# Blueprint do Render (plano gratuito). Banco: PostgreSQL gratuito no Neon ou Supabase (cole a URL em DATABASE_URL).
services:
  - type: web
    name: mckbot
    runtime: node
    plan: free
    region: virginia # mesma região do banco (Neon AWS us-east-1) para menor latência; o Render não tem região no Brasil
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # cole a connection string do Neon/Supabase (com sslmode=require)
      - key: MASTER_KEY
        generateValue: true # 256 bits em base64. NUNCA troque depois: os segredos salvos ficariam ilegíveis.
      - key: GRAPH_API_VERSION
        value: v26.0
      - key: FLOW_MAX_STEPS
        value: "50"
      # E-mails transacionais (opcional; sem e-mail configurado o app funciona e só registra no log)
      - key: BREVO_API_KEY
        sync: false # recomendado no Render Free: envia pela API HTTP do Brevo (porta 443), sem depender de SMTP
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525" # o Render Free bloqueia 25/465/587; o Brevo aceita 2525
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Escudo de segurança
      # Backup diário cifrado do banco (grátis): repositório GitHub PRIVADO + token fine-grained (Contents: read/write só nele)
      - key: BACKUP_GITHUB_REPO
        sync: false # ex.: mayckH100/mck-backups (PRIVADO; o app recusa repositório público)
      - key: BACKUP_GITHUB_TOKEN
        sync: false
      - key: BACKUP_EMAIL
        sync: false # opcional: também envia o arquivo cifrado por e-mail (exige BREVO_API_KEY ou SMTP + MAIL_FROM)
      - key: ACCOUNT_LOCK_THRESHOLD
        value: "5" # senhas/códigos errados seguidos até bloquear a conta
      - key: ACCOUNT_LOCK_MINUTES
        value: "15" # 1º bloqueio; dobra a cada nova falha (máx. 24 h)
      # Novidades (Painel Master > Novidades): publicação no site e nas redes sociais oficiais. Todas opcionais.
      - key: PUBLIC_URL
        sync: false # ex.: https://mckbot.onrender.com (base das URLs de retorno do OAuth; vazio = esse padrão)
      - key: META_APP_ID
        sync: false # app da Meta (vazio = 1865951357919820)
      - key: META_APP_SECRET
        sync: false # segredo do app da Meta (Instagram via Facebook Login)
      - key: GOOGLE_YT_CLIENT_ID
        sync: false # OAuth do Google para o YouTube (pode ser o mesmo projeto da Agenda, com a YouTube Data API ativada)
      - key: GOOGLE_YT_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false # app do LinkedIn com o produto Community Management API (w_organization_social)
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_ORG_ID
        sync: false # id da Página da empresa (vazio = 145406914)
      - key: TIKTOK_CLIENT_KEY
        sync: false # reservado: integração com o TikTok ainda não disponível
      - key: TIKTOK_CLIENT_SECRET
        sync: false
